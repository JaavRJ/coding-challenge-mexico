spring:
  application:
    name: nobatrade
  threads:
    virtual:
      enabled: true  # Java 21 Virtual Threads — Project Loom
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:/tmp/nobatrade;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        nexustrade.decision.latency: true
        nexustrade.orderbook.staleness: true

nexustrade:
  engine:
    decision-timeout-ms: 200
    evaluation-interval-ms: 500  # Engine evalúa cada 500ms (reducido para ahorrar bandwidth)

  risk:
    circuit-breaker-losses: 3
    circuit-breaker-pause-seconds: 60
    max-balance-drawdown-pct: 2.0
    rebalance-threshold-pct: 40.0

  wallet:
    initial-usdt: 100000.0
    initial-btc: 1.0

  exchanges:
    binance:
      ws-url: "wss://stream.binance.com:9443/stream?streams=btcusdt@depth20@1000ms/ethbtc@depth20@1000ms/ethusdt@depth20@1000ms"
      rest-url: "https://api.binance.com/api/v3/depth?symbol=BTCUSDT&limit=20"
      api-key: ${BINANCE_API_KEY:''}
      api-secret: ${BINANCE_API_SECRET:''}
      fee-maker: 0.001
      fee-taker: 0.001
      withdrawal-fee-btc: 0.0005

    kraken:
      ws-url: "wss://ws.kraken.com/v2"
      rest-url: "https://api.kraken.com/0/public/Depth?pair=XBTUSD&count=20"
      api-key: ${KRAKEN_API_KEY:''}
      api-secret: ${KRAKEN_API_SECRET:''}
      fee-maker: 0.0016
      fee-taker: 0.0026
      withdrawal-fee-btc: 0.0002

    coinbase:
      ws-url: "wss://advanced-trade-ws.coinbase.com"
      rest-url: "https://api.coinbase.com/api/v3/brokerage/best_bid_ask?product_ids=BTC-USD"
      api-key: ${COINBASE_API_KEY:''}
      api-secret: ${COINBASE_API_SECRET:''}
      fee-maker: 0.004
      fee-taker: 0.006
      withdrawal-fee-btc: 0.0

    bitfinex:
      ws-url: "wss://api-pub.bitfinex.com/ws/2"
      rest-url: "https://api-pub.bitfinex.com/v2/book/tBTCUSD/P0"
      fee-maker: 0.001
      fee-taker: 0.002
      withdrawal-fee-btc: 0.0004

    okx:
      ws-url: "wss://ws.okx.com:8443/ws/v5/public"
      rest-url: "https://www.okx.com/api/v5/market/books?instId=BTC-USDT"
      fee-maker: 0.0008
      fee-taker: 0.001
      withdrawal-fee-btc: 0.0003

  persistence:
    events-file: "./data/events.jsonl"
    max-history-size: 10000

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  chat:
    id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    com.nexustrade: DEBUG
    org.java_websocket: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{30}) - %msg%n"
